services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/db/beauty_bot.db
    volumes:
      - ./data:/app/data          # katalogni konteynerni qayta qurmasdan tahrirlash (/reload)
      - beauty-db:/app/db         # ma'lumotlar bazasi saqlanadi
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  beauty-db:
